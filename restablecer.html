
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña | Sistema de Inventario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      box-sizing: border-box;
    }
    main {
      background: white;
      padding: 28px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { font-size: 24px; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #mensaje { margin-top: 16px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Crear contraseña nueva</h1>
  <p>Escribe tu nueva contraseña para volver a entrar a la aplicación.</p>

  <form id="formulario">
    <label for="password">Nueva contraseña</label>
    <input id="password" type="password" minlength="8"
      maxlength="128" autocomplete="new-password" required>

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" type="password" minlength="8"
      maxlength="128" autocomplete="new-password" required>

    <button id="guardar" type="submit">Guardar contraseña nueva</button>
  </form>
  <p id="mensaje" role="status"></p>
</main>

<script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://janqdxwwijivtwxpstmc.supabase.co";

  // Usa aquí la clave publicable (publishable) del proyecto.
  // Nunca uses service_role ni una clave secreta en esta página.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_feBHclIVLQIvwtogw3QV8A_ZDyCts9m";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const formulario = document.getElementById("formulario");
  const mensaje = document.getElementById("mensaje");
  const boton = document.getElementById("guardar");

  let sesionLista = false;

  async function prepararRecuperacion() {
    const url = new URL(window.location.href);
    const hash = new URLSearchParams(url.hash.slice(1));
    const errorUrl = hash.get("error_description") ||
      url.searchParams.get("error_description");

    if (errorUrl) {
      mensaje.textContent =
        "El enlace no es válido o ha caducado. Solicita otro correo de recuperación.";
      formulario.hidden = true;
      return;
    }

    // Flujo de recuperación con access_token en el fragmento de la URL.
    const accessToken = hash.get("access_token");
    const refreshToken = hash.get("refresh_token");
    const type = hash.get("type");

    if (accessToken && refreshToken && type === "recovery") {
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) {
        mensaje.textContent =
          "No pudimos validar el enlace. Solicita uno nuevo.";
        formulario.hidden = true;
        return;
      }

      history.replaceState(null, "", window.location.pathname);
      sesionLista = true;
      return;
    }

    // Flujo PKCE: Supabase devuelve un código en la URL.
    const code = url.searchParams.get("code");

    if (code) {
      const { error } = await supabase.auth.exchangeCodeForSession(code);

      if (error) {
        mensaje.textContent =
          "El enlace no es válido o ha caducado. Solicita uno nuevo.";
        formulario.hidden = true;
        return;
      }

      history.replaceState(null, "", window.location.pathname);
      sesionLista = true;
      return;
    }

    mensaje.textContent =
      "Abre esta página desde el enlace más reciente que recibiste por correo.";
    formulario.hidden = true;
  }

  formulario.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!sesionLista) {
      mensaje.textContent = "Primero debes abrir un enlace válido de recuperación.";
      return;
    }

    const password = document.getElementById("password").value;
    const confirmar = document.getElementById("confirmar").value;

    if (password.length < 8 || password.length > 128) {
      mensaje.textContent =
        "La contraseña debe tener entre 8 y 128 caracteres.";
      return;
    }

    if (password !== confirmar) {
      mensaje.textContent = "Las contraseñas no coinciden.";
      return;
    }

    boton.disabled = true;
    mensaje.textContent = "Guardando la contraseña...";

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      mensaje.textContent =
        "No se pudo cambiar la contraseña. " + error.message;
      boton.disabled = false;
      return;
    }

    formulario.hidden = true;
    mensaje.textContent =
      "¡Contraseña actualizada! Ya puedes iniciar sesión en la aplicación Android.";
  });

  prepararRecuperacion().catch(() => {
    mensaje.textContent =
      "No pudimos validar el enlace. Solicita un correo nuevo e inténtalo otra vez.";
    formulario.hidden = true;
  });
</script>
</body>
</html>
